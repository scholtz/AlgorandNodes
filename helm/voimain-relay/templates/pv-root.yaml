{{- if .Values.pvRoot.hostPath }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.prefix }}{{ .Values.pvRoot.name }}
spec:
  {{- if or .Values.nodeName .Values.deployment.nodeSelector }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.nodeName | default .Values.deployment.nodeSelector }}
  {{- end }}
  storageClassName: {{ .Values.pvcRoot.storageClassName | quote }}
  capacity:
    storage: {{ .Values.pvcRoot.resources.requests.storage }}
  accessModes:
    - {{ .Values.pvcRoot.accessMode }}
  hostPath:
    path: {{ .Values.pvRoot.hostPath }}
{{- end }}
