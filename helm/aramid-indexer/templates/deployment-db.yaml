apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prefix }}{{ .Values.deploymentDB.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{ .Values.deploymentDB.label.key }}: {{ .Values.prefix }}{{ .Values.deploymentDB.label.value }}
  template:
    metadata:
      labels:
        {{ .Values.deploymentDB.label.key }}: {{ .Values.prefix }}{{ .Values.deploymentDB.label.value }}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # postgres needs time for a clean shutdown, otherwise crash recovery runs on next start
      terminationGracePeriodSeconds: 60
      {{- include "indexer.scheduling" . | nindent 6 }}
      containers:
        - name: {{ .Values.prefix }}{{ .Values.deploymentDB.label.value }}
          image: {{ .Values.deploymentDB.image }}:{{ .Values.deploymentDB.tag }}
          imagePullPolicy: {{ .Values.deploymentDB.imagePullPolicy }}
          {{- if .Values.debug }}
          command: ['/bin/bash', '-ec', 'while :; do date; sleep 60 ; done']
          {{- end }}
          resources:
            requests:
              memory: {{ .Values.deploymentDB.resources.requests.memory }}
              cpu: {{ .Values.deploymentDB.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deploymentDB.resources.limits.memory }}
              cpu: {{ .Values.deploymentDB.resources.limits.cpu }}
          env:
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prefix }}{{ .Values.secretIndexer.name }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prefix }}{{ .Values.secretIndexer.name }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prefix }}{{ .Values.secretIndexer.name }}
                  key: POSTGRES_DB
          ports:
            - containerPort: {{ .Values.serviceDB.port.target }}
              protocol: TCP
          {{- if not .Values.debug }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.serviceDB.port.target }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.serviceDB.port.target }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          {{- end }}
          securityContext:
            {{- include "indexer.containerSecurity" 999 | nindent 12 }}
          volumeMounts:
            - name: db-data
              mountPath: /data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ .Values.prefix }}{{ .Values.pvcDB.name }}
