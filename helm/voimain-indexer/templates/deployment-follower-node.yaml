apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prefix }}{{ .Values.deploymentFollowerNode.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{ .Values.deploymentFollowerNode.label.key }}: {{ .Values.prefix }}{{ .Values.deploymentFollowerNode.label.value }}
  template:
    metadata:
      labels:
        {{ .Values.deploymentFollowerNode.label.key }}: {{ .Values.prefix }}{{ .Values.deploymentFollowerNode.label.value }}
      annotations:
        checksum/tokens: {{ include (print $.Template.BasePath "/secret-indexer.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # give algod time to stop cleanly
      terminationGracePeriodSeconds: 30
      {{- include "indexer.scheduling" . | nindent 6 }}
      {{- if not .Values.debug }}
      initContainers:
        {{- include "indexer.waitFor" (dict "root" . "title" "DB Server" "host" (printf "%s%s" .Values.prefix .Values.serviceDB.name) "port" .Values.serviceDB.port.service) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.prefix }}follow-node
          image: {{ .Values.deploymentFollowerNode.image }}:{{ .Values.deploymentFollowerNode.tag }}
          imagePullPolicy: {{ .Values.deploymentFollowerNode.imagePullPolicy }}
          {{- if .Values.debug }}
          command: ['/bin/bash', '-ec', 'while :; do date; sleep 60 ; done']
          {{- else if .Values.deploymentFollowerNode.command }}
          command:
            {{- toYaml .Values.deploymentFollowerNode.command | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ['goal', 'node', 'stop']
          resources:
            requests:
              memory: {{ .Values.deploymentFollowerNode.resources.requests.memory }}
              cpu: {{ .Values.deploymentFollowerNode.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deploymentFollowerNode.resources.limits.memory }}
              cpu: {{ .Values.deploymentFollowerNode.resources.limits.cpu }}
          ports:
            - containerPort: {{ .Values.serviceFollowerNode.port.target }}
              protocol: TCP
          {{- if not .Values.debug }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.serviceFollowerNode.port.target }}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: {{ .Values.serviceFollowerNode.port.target }}
            initialDelaySeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: {{ .Values.serviceFollowerNode.port.target }}
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          securityContext:
            {{- include "indexer.containerSecurity" 1000 | nindent 12 }}
          volumeMounts:
            - name: follow-node-data
              mountPath: /app/data
            - name: tokens
              subPath: INDEXER_ALGOD_TOKEN
              mountPath: /app/data/algod.token
            - name: tokens
              subPath: INDEXER_API_TOKEN
              mountPath: /app/data/algod.admin.token
      volumes:
        - name: tokens
          secret:
            secretName: {{ .Values.prefix }}{{ .Values.secretIndexer.name }}
        - name: follow-node-data
          persistentVolumeClaim:
            claimName: {{ .Values.prefix }}{{ .Values.pvcFollowNode.name }}
